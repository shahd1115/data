<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>اختبار إدارة مشتريات ومخازن</title>
<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Tahoma',sans-serif;
    background:linear-gradient(135deg,#ffecd2,#fcb69f);
    min-height:100vh;
    padding:30px;
}

.container{
    max-width:1100px;
    margin:auto;
}

.main-card{
    background:white;
    border-radius:30px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
}

.header{
    background:linear-gradient(135deg,#ff6a00,#ee0979);
    color:white;
    padding:40px 20px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:40px;
}

.header p{
    margin-top:10px;
    font-size:20px;
}

.section{
    padding:30px;
}

.section-title{
    font-size:28px;
    margin-bottom:25px;
    padding:15px;
    border-radius:20px;
    color:white;
    text-align:center;
}

.mcq-title{
    background:linear-gradient(135deg,#36d1dc,#5b86e5);
}

.tf-title{
    background:linear-gradient(135deg,#11998e,#38ef7d);
}

.question{
    background:#fff;
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
    border:3px solid #f3f4f6;
    transition:0.3s;
}

.question:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 20px rgba(0,0,0,0.1);
}

.question h3{
    margin-top:0;
    color:#222;
    line-height:1.8;
}

label{
    display:block;
    background:#f9fafb;
    padding:12px;
    margin:10px 0;
    border-radius:12px;
    cursor:pointer;
    transition:0.3s;
}

label:hover{
    background:#ede9fe;
}

input[type="radio"]{
    margin-left:10px;
}

.correct{
    color:#059669;
    font-weight:bold;
    background:#d1fae5;
    padding:10px;
    border-radius:10px;
    margin-top:10px;
}

.wrong{
    color:#dc2626;
    font-weight:bold;
    background:#fee2e2;
    padding:10px;
    border-radius:10px;
    margin-top:10px;
}

button{
    width:100%;
    padding:18px;
    border:none;
    border-radius:0;
    background:linear-gradient(135deg,#ff6a00,#ee0979);
    color:white;
    font-size:24px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    opacity:0.9;
}

#result{
    text-align:center;
    padding:30px;
    font-size:30px;
    font-weight:bold;
    color:#7c2d12;
    background:#fff7ed;
}
</style>
</head>
<body>

<div class="container">
<div class="main-card">
<div class="header">
<h1>اختبار إدارة مشتريات ومخازن</h1>
<p>اختبار تفاعلي شامل لكل الأسئلة</p>
</div>

<div class="section">
<div id="mcqSection">
<h2 class="section-title mcq-title">أسئلة الاختيار</h2>
<form id="mcqForm"></form>
</div>

<div id="tfSection" style="margin-top:50px;">
<h2 class="section-title tf-title">أسئلة الصح والغلط</h2>
<form id="tfForm"></form>
</div>

<button type="button" onclick="showResult()">إنهاء الاختبار</button>

<div id="result"></div>
</div>
</div>

<script>

const questions = [

// اختر

{
 type:'mcq',
 q:'1- من مصادر المعلومات عن الموردين؟',
 options:['العميل','الدليل التجاري','الرقابة','لا شيء مما سبق'],
 answer:'الدليل التجاري'
},
{
 type:'mcq',
 q:'2- من إيجابيات التعامل مع مورد واحد؟',
 options:['صعوبة الإجراءات','خفض المخاطر','خفض التكاليف','زيادة التكاليف'],
 answer:'خفض التكاليف'
},
{
 type:'mcq',
 q:'3- من أسباب إستراتيجية التعامل مع المنتج مباشرة بدلاً من الموزع؟',
 options:['عدم توافر المنتج','صغر حجم الكمية','البيع نقدًا','كبر حجم الكمية المشتراة'],
 answer:'كبر حجم الكمية المشتراة'
},
{
 type:'mcq',
 q:'4- من خصائص الإنتاج النمطي للسوق؟',
 options:['تغيير تصميم المنتج','صعوبة التخطيط للإنتاج','مواد خام موحدة المواصفات','لا شيء مما سبق'],
 answer:'مواد خام موحدة المواصفات'
},
{
 type:'mcq',
 q:'5- من التحديات التي تواجه مدير الاحتياجات في شركة المقاولات؟',
 options:['قلة الوسطاء','بعد التسعير','توريد كميات كبيرة للموقع','الإنتاج'],
 answer:'توريد كميات كبيرة للموقع'
},
{
 type:'mcq',
 q:'6- تُعرف إجراءات الشراء بأنها؟',
 options:['التسويق','البيع','خطوات افتراضية','الخطوات التفصيلية التي يتبعها مسئول الشراء'],
 answer:'الخطوات التفصيلية التي يتبعها مسئول الشراء'
},
{
 type:'mcq',
 q:'7- من المشكلات التي تواجه مدير الاحتياجات بعد إتمام التنفيذ؟',
 options:['التسويق','البيع','المنتجين','تخزين بواقي المستلزمات والمعدات'],
 answer:'تخزين بواقي المستلزمات والمعدات'
},
{
 type:'mcq',
 q:'8- من الاعتبارات التي يجب مراعاتها عند تحديد إجراءات الشراء؟',
 options:['سهولة فهم الإجراءات','صعوبة فهم الإجراءات','عدم تدوينها','عدم نشرها'],
 answer:'سهولة فهم الإجراءات'
},
{
 type:'mcq',
 q:'9- من متطلبات التجارة الإلكترونية توفير موارد بشرية تكون خبرتها؟',
 options:['بدون خبرة','عالية','متوسطة','منخفضة'],
 answer:'عالية'
},
{
 type:'mcq',
 q:'10- ما المقصود بنظام ERP؟',
 options:['نظام تقليدي','نظام افتراضي','يربط بين كل أقسام المنظمة','نظام للحسابات فقط'],
 answer:'يربط بين كل أقسام المنظمة'
},
{
 type:'mcq',
 q:'11- من العوامل الاجتماعية المؤثرة في قرار الشراء؟',
 options:['الضمان','الجماعة المحيطة بالمستهلك','رأس المال','السعر'],
 answer:'الجماعة المحيطة بالمستهلك'
},
{
 type:'mcq',
 q:'12- الهدف الرئيسي من التخطيط للشراء؟',
 options:['التخزين العشوائي','الشراء على أساس علمي','تعقيد الشراء','خفض الأرباح'],
 answer:'الشراء على أساس علمي'
},
{
 type:'mcq',
 q:'13- من مخاطر الشراء حسب الحاجة؟',
 options:['انخفاض الجودة','زيادة المخزون','توقف الإنتاج بسبب التأخير','خفض الأسعار'],
 answer:'توقف الإنتاج بسبب التأخير'
},
{
 type:'mcq',
 q:'14- تحقيق المرونة في الإجراءات يقصد به؟',
 options:['الانسجام والتوافق','إمكانية التعديل والتغيير','عدم التعديل','الخصم'],
 answer:'إمكانية التعديل والتغيير'
},
{
 type:'mcq',
 q:'15- يهدف أسلوب الشراء للمضاربة إلى؟',
 options:['خسارة المنظمة','تحقيق ربح نتيجة تغيرات الأسعار','سمعة المنظمة','زيادة تكاليف النقل'],
 answer:'تحقيق ربح نتيجة تغيرات الأسعار'
},
{
 type:'mcq',
 q:'16- الشراء الاستهلاكي يهدف إلى؟',
 options:['صعوبة الإجراءات','إشباع الحاجة','التخزين','زيادة التكاليف'],
 answer:'إشباع الحاجة'
},
{
 type:'mcq',
 q:'17- يتحقق الوقت المناسب للشراء عندما يتم الحصول على الأصناف في وقت؟',
 options:['الشراء ذاته','يناسب احتياجات الإنتاج','زيادة التكاليف','زيادة الأسعار'],
 answer:'يناسب احتياجات الإنتاج'
},
{
 type:'mcq',
 q:'18- أي مستوى إداري يركز على دعم اتخاذ القرارات الاستراتيجية؟',
 options:['الإدارة الدنيا','الإدارة الوسطى','الإدارة العليا','لا شيء مما سبق'],
 answer:'الإدارة العليا'
},

// صح وغلط

{type:'tf', q:'1- يقصد بمصدر الشراء المناسب التعرف على الموردين واختيار أفضلهم.', answer:'صح'},
{type:'tf', q:'2- سياسة التصنيع تعني الاعتماد على الإنتاج الداخلي بدلاً من الشراء من الخارج.', answer:'صح'},
{type:'tf', q:'3- من المعايير المهمة لاختيار المورد سمعة المورد في السوق.', answer:'صح'},
{type:'tf', q:'4- مرحلة المسح العام للمصادر هي المرحلة الأولى في عملية اختيار المورد الأمثل.', answer:'صح'},
{type:'tf', q:'5- مدير الاحتياجات في شركة المقاولات له دور هام في زيادة التكاليف.', answer:'خطأ'},
{type:'tf', q:'6- يفضل التعامل مع المورد الذي يمتلك طاقة إنتاجية احتياطية.', answer:'صح'},
{type:'tf', q:'7- من مصادر المعلومات عن الموردين الإعلانات والكتالوجات وزيارة المصنع.', answer:'صح'},
{type:'tf', q:'8- من أسباب تفضيل التعامل مع مورد واحد زيادة المنافسة بين الموردين.', answer:'خطأ'},
{type:'tf', q:'9- يتم التعامل مع المنتج مباشرة عندما تكون الكمية صغيرة.', answer:'خطأ'},
{type:'tf', q:'10- من أسباب تفضيل مصادر الشراء المحلية سرعة تسليم الطلبيات.', answer:'صح'},
{type:'tf', q:'11- من أنواع النشاط الإنتاجي الإنتاج النمطي والإنتاج حسب الطلب ونشاط المقاولات.', answer:'صح'},
{type:'tf', q:'12- من خصائص الإنتاج النمطي القدرة على التخطيط السابق للعمليات الإنتاجية.', answer:'صح'},
{type:'tf', q:'13- في الإنتاج حسب الطلب تكون المواد الخام نمطية وموحدة المواصفات.', answer:'خطأ'},
{type:'tf', q:'14- من خصائص الإنتاج حسب الطلب سهولة تقدير الاحتياجات مقدماً.', answer:'خطأ'},
{type:'tf', q:'15- مدير الاحتياجات في شركة المقاولات له دور هام في زيادة التكاليف.', answer:'خطأ'},
{type:'tf', q:'16- الإنتاج النمطي يسمح بالتوسع في استخدام التكنولوجيا ودرجات عالية من الآلية.', answer:'صح'},
{type:'tf', q:'17- المواد الخام في الإنتاج النمطي غالباً غير موحدة المواصفات.', answer:'خطأ'},
{type:'tf', q:'18- الإنتاج النمطي يتميز بعدم القدرة على التخطيط المسبق.', answer:'خطأ'},
{type:'tf', q:'19- لا يشترط نشر الإجراءات على العاملين.', answer:'خطأ'},
{type:'tf', q:'20- المقصود بالشراء مجموعة أنشطة لتوفير المواد في الوقت والسعر المناسب.', answer:'صح'},
{type:'tf', q:'21- طريقة الأسماء والعلامات التجارية تعتبر من طرق تحديد الجودة المناسبة.', answer:'صح'},
{type:'tf', q:'22- الهدف من الإجراءات هو توحيد طرق العمل داخل المنظمة.', answer:'صح'},
{type:'tf', q:'23- من خصائص المقاولات عدم معرفة نوعية الأعمال مسبقاً.', answer:'صح'},
{type:'tf', q:'24- من إيجابيات التعامل مع عدة موردين اختيار المورد المناسب وتحقيق التنافسية.', answer:'صح'},
{type:'tf', q:'25- تدفق الإنتاج في النظام النمطي يكون غير منتظم.', answer:'خطأ'},
{type:'tf', q:'26- الإنتاج النمطي يحتاج مخزون لفترة قصيرة فقط.', answer:'خطأ'},
{type:'tf', q:'27- يفضل التعامل مع المورد الذي لا يمتلك أي طاقة إنتاجية احتياطية.', answer:'خطأ'},
{type:'tf', q:'28- تعريف إجراءات الشراء هو الخطوات التفصيلية التي يتبعها مسئول الشراء.', answer:'صح'},
{type:'tf', q:'29- من أهمية تحديد إجراءات الشراء تعقيد طرق العمل.', answer:'خطأ'},
{type:'tf', q:'30- تبدأ إجراءات الشراء بإصدار الفواتير.', answer:'خطأ'},
{type:'tf', q:'31- يجب مراعاة التكاليف عند تنفيذ إجراءات الشراء.', answer:'صح'},
{type:'tf', q:'32- من صور التخطيط للشراء وضع موازنة تقديرية للمشتريات.', answer:'صح'},
{type:'tf', q:'33- مرحلة المسح العام للمصادر هي المرحلة الأولى في اختيار المورد.', answer:'صح'},
{type:'tf', q:'34- الكتالوجات فقط تعتبر من مصادر المعلومات عن الموردين.', answer:'خطأ'},
{type:'tf', q:'35- بعض السلع مثل الأخشاب يجب شراؤها قبل الاستخدام بفترة طويلة.', answer:'صح'},
{type:'tf', q:'36- الإنتاج النمطي يسمح بالتوسع في استخدام التكنولوجيا.', answer:'صح'},
{type:'tf', q:'37- الهدف من التخطيط للشراء أن يتم الشراء بشكل عشوائي.', answer:'خطأ'},
{type:'tf', q:'38- تحقيق المرونة في الإجراءات يعني عدم القدرة على التعديل.', answer:'خطأ'},
{type:'tf', q:'39- المقصود بالشراء مجموعة أنشطة لتوفير المواد في الوقت والسعر المناسب.', answer:'صح'},
{type:'tf', q:'40- تطور التكنولوجيا يساعد المنظمات على تحقيق وفورات اقتصادية.', answer:'صح'},
{type:'tf', q:'41- وظيفة الشراء لا تؤثر على القدرة التنافسية للمنشأة.', answer:'خطأ'},
{type:'tf', q:'42- عدم الشراء في الوقت المناسب يؤدي إلى اضطرابات في الإنتاج.', answer:'صح'},
{type:'tf', q:'43- نظام ERP جاء نتيجة تطور مفهوم الإدارة اللوجستية.', answer:'صح'},
{type:'tf', q:'44- كلما زادت نفقات الشراء زاد صافي ربح المنشأة.', answer:'خطأ'},
{type:'tf', q:'45- الحفاظ على مخزون مرتفع دائماً أفضل وسيلة لتجنب توقف الإنتاج.', answer:'خطأ'},
{type:'tf', q:'46- في الماضي كانت كل إدارة تقوم بعملية الشراء بنفسها.', answer:'صح'},
{type:'tf', q:'47- من أهداف الشراء تحسين المركز التنافسي للمنظمة.', answer:'صح'},
{type:'tf', q:'48- يساعد أسلوب الشراء للمستقبل في تخفيض تكاليف الشراء.', answer:'صح'},
{type:'tf', q:'49- تعتبر سياسات الإنتاج من المتغيرات الخارجية.', answer:'خطأ'},
{type:'tf', q:'50- المواد الخام يجب أن تتوافر من حيث الكمية والزمن والجودة.', answer:'صح'},
{type:'tf', q:'51- من عيوب التجارة الإلكترونية الإخطار السريع للتعديلات.', answer:'خطأ'},
{type:'tf', q:'52- استخدام ERP في المشتريات والمخازن يقلل الفاقد ويحسن الرقابة على المخزون.', answer:'صح'}

];

const mcqForm = document.getElementById('mcqForm');
const tfForm = document.getElementById('tfForm');

questions.forEach((item,index)=>{

const div = document.createElement('div');
div.classList.add('question');

let html = `<h3>${item.q}</h3>`;

if(item.type === 'mcq'){

item.options.forEach(option=>{
html += `
<label>
<input type="radio" name="q${index}" value="${option}">
${option}
</label>
`;
});

}else{

html += `
<label><input type="radio" name="q${index}" value="صح"> صح</label>
<label><input type="radio" name="q${index}" value="خطأ"> خطأ</label>
`;
}

html += `<div id="feedback${index}"></div>`;

div.innerHTML = html;
if(item.type === 'mcq'){
mcqForm.appendChild(div);
}else{
tfForm.appendChild(div);
}

const radios = div.querySelectorAll('input');

radios.forEach(radio=>{
radio.addEventListener('change',()=>{

const feedback = document.getElementById(`feedback${index}`);

if(radio.value === item.answer){
feedback.innerHTML = '✔ إجابة صحيحة';
feedback.className = 'correct';
}else{
feedback.innerHTML = `✘ إجابة خاطئة — الإجابة الصحيحة: ${item.answer}`;
feedback.className = 'wrong';
}

});
});

});

function showResult(){

let score = 0;

questions.forEach((item,index)=>{

const selected = document.querySelector(`input[name="q${index}"]:checked`);

if(selected && selected.value === item.answer){
score++;
}

});

const percentage = ((score/questions.length)*100).toFixed(1);

document.getElementById('result').innerHTML = `
درجتك النهائية: ${score} من ${questions.length}<br>
النسبة المئوية: ${percentage}%
`;

window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}

</script>

</body>
</html>
