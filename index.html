        let currentQuestion = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let answered = false;

        function renderQuestion() {
            answered = false;
            const container = document.getElementById('quiz-container');
            const q = questions[currentQuestion];
            
            let optionsHtml = '';
            q.options.forEach((opt, index) => {
                optionsHtml += `
                    <button class="option-btn" id="option-${index}" onclick="answer(${index})">
                        <span class="option-letter">${opt.letter}</span>
                        ${opt.text}
                    </button>
                `;
            });
            
            container.innerHTML = `
                <div class="question-card" id="question-card">
                    <div class="question-number">السؤال ${currentQuestion + 1} من 50</div>
                    <div class="question-text">${q.q}</div>
                    <div class="options">
                        ${optionsHtml}
                    </div>
                    <div class="feedback" id="feedback">
                        <div class="feedback-title" id="feedback-title"></div>
                        <div class="feedback-text" id="feedback-text"></div>
                    </div>
                    <button class="next-btn" id="next-btn" onclick="nextQuestion()">السؤال التالي ←</button>
                </div>
            `;
            
            updateProgress();
        }

        function answer(selectedIndex) {
            if (answered) return;
            answered = true;
            
            const q = questions[currentQuestion];
            const isCorrect = selectedIndex === q.correct;
            const feedback = document.getElementById('feedback');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackText = document.getElementById('feedback-text');
            const nextBtn = document.getElementById('next-btn');
            
            // Highlight all options
            q.options.forEach((opt, index) => {
                const btn = document.getElementById(`option-${index}`);
                btn.disabled = true;
                
                if (index === q.correct) {
                    btn.classList.add('correct-answer');
                } else if (index === selectedIndex && !isCorrect) {
                    btn.classList.add('selected-wrong');
                }
            });
            
            // Show feedback
            feedback.style.display = 'block';
            if (isCorrect) {
                correctCount++;
                feedback.className = 'feedback correct-answer';
                feedbackTitle.innerHTML = '🎉 إجابة صحيحة!';
                document.getElementById('correct-count').textContent = correctCount;
            } else {
                wrongCount++;
                feedback.className = 'feedback wrong-answer';
                feedbackTitle.innerHTML = '😕 إجابة خاطئة';
                document.getElementById('wrong-count').textContent = wrongCount;
            }
            
            feedbackText.innerHTML = q.exp;
            nextBtn.style.display = 'inline-block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= questions.length) {
                showResults();
            } else {
                renderQuestion();
            }
        }

        function updateProgress() {
            document.getElementById('current-question').textContent = `${currentQuestion + 1}/50`;
            const progress = ((currentQuestion + 1) / 50) * 100;
            document.getElementById('progress-fill').style.width = progress + '%';
        }

        function showResults() {
            document.getElementById('quiz-container').style.display = 'none';
            document.querySelector('.score-board').style.display = 'none';
            document.querySelector('.progress-bar').style.display = 'none';
            document.querySelector('.header').style.display = 'none';
            
            const resultsScreen = document.getElementById('results-screen');
            resultsScreen.style.display = 'block';
            
            document.getElementById('final-score').textContent = `${correctCount}/50`;
            
            let message = '';
            let emoji = '';
            const percentage = (correctCount / 50) * 100;
            
            if (percentage >= 90) {
                emoji = '🏆';
                message = 'أداء ممتاز! أنت خبير في تحليل وتصميم النظم! 🌟';
            } else if (percentage >= 70) {
                emoji = '🎉';
                message = 'أداء جيد جداً! استمر في التقدم! 👏';
            } else if (percentage >= 50) {
                emoji = '👍';
                message = 'أداء مقبول. راجع الدروس وحاول مرة أخرى! 📚';
            } else {
                emoji = '💪';
                message = 'لا تيأس! راجع المادة وحاول مرة أخرى، أنت قادر! 🌟';
            }
            
            document.getElementById('result-emoji').textContent = emoji;
            document.getElementById('result-message').textContent = message;
        }

        function restartQuiz() {
            currentQuestion = 0;
            correctCount = 0;
            wrongCount = 0;
            answered = false;
            
            document.getElementById('quiz-container').style.display = 'block';
            document.querySelector('.score-board').style.display = 'flex';
            document.querySelector('.progress-bar').style.display = 'block';
            document.querySelector('.header').style.display = 'block';
            document.getElementById('results-screen').style.display = 'none';
            
            document.getElementById('correct-count').textContent = '0';
            document.getElementById('wrong-count').textContent = '0';
            
            renderQuestion();
        }

        // Start the quiz
        renderQuestion();
